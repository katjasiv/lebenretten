<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendenaktion für Tierheim Troisdorf</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            text-align: center;
        }
        .container {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        .info {
            margin: 20px 0;
        }
        .form-group {
            margin: 15px 0;
            text-align: left;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .success-message {
            display: none;
            color: green;
            margin-top: 15px;
        }
    </style>
    <script>
        function submitForm(event) {
            event.preventDefault();
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('registration-form').reset();

            const name = document.getElementById('name').value;
            const teilnahme = document.querySelector('input[name="teilnahme"]:checked').value;
            const mailtoLink = `mailto:katjasivkova2006@gmail.com?subject=Anmeldung%20zur%20Spendenaktion&body=Name:%20${name}%0AAntwort:%20${teilnahme}`;
            window.location.href = mailtoLink;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Spendenaktion für Tierheim Troisdorf</h1>
        <div class="info">
            <p><strong>Datum:</strong> 17. Februar 2025</p>
            <p><strong>Uhrzeit:</strong> 10:00 - 10:45 Uhr</p>
            <p><strong>Ort:</strong> Berufskolleg Siegburg - Aula</p>
        </div>
        
        <form id="registration-form" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="name">Dein Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label>Möchtest du teilnehmen?</label><br>
                <input type="radio" id="ja" name="teilnahme" value="Ja, ich werde da sein!" required>
                <label for="ja">Ja, ich werde da sein!</label><br>
                <input type="radio" id="nein" name="teilnahme" value="Nein, ich komme nicht.">
                <label for="nein">Nein, ich komme nicht.</label>
            </div>
            <button type="submit">Anmeldung absenden</button>
        </form>
        <p id="success-message" class="success-message">Vielen Dank für deine Anmeldung!</p>
    </div>
</body>
</html>
